<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Horse Race{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/">The&nbsp;Horse&nbsp;Race</a>
    <nav class="masthead-nav">
      <a href="/quiz">Race</a>
      <a href="/results">Standings</a>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Questions built nightly from Guardian reporting, vetted by three LLM judges.</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
