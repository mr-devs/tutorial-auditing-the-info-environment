[project]
name = "horserace-site"
version = "0.1.0"
description = "Horse-race website: humans vs. web-searching AI models on fresh news MCQs (tutorial Step 5)"
requires-python = ">=3.10"
dependencies = [
    # Pipeline (sitekit — copied from the tutorial toolkit)
    "requests",
    "tenacity",
    "openai>=2.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.6.0",
    # Web app
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",  # fastapi.testclient
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
