# nginx site config for the horse-race site.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/horserace
#   sudo ln -s /etc/nginx/sites-available/horserace /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS with certbot:
#   sudo certbot --nginx -d your.domain.example

# Cheap abuse brake: each quiz session costs ~30 web-search AI calls, so
# rate-limit session creation per client IP.
limit_req_zone $binary_remote_addr zone=sessions:10m rate=5r/m;

server {
    listen 80;
    server_name your.domain.example;

    client_max_body_size 1m;

    location /static/ {
        alias /opt/horserace/site/static/;
        expires 1h;
    }

    location = /api/sessions {
        limit_req zone=sessions burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
